# Пока здесь только то, что нужно для генерации данных.
# По ходу курса этот файл вырастет:
# занятие 3 — гиперпараметры +
# занятие 5 — пути стадий
# занятие 6 — настройки MLflow.

seed: 42

data:
  n_samples: 20000
  raw_path: data/raw/churn.csv
  processed_dir: data/processed
  test_size: 0.2
  val_size: 0.1

# Занятие 1
# Признаки модели по типам. customer_id (идентификатор) и churn (таргет)
# сюда намеренно не входят.
features:
  numeric:
    - tenure_months
    - monthly_charges
    - total_charges
    - num_support_calls
    - avg_monthly_gb
  categorical:
    - contract_type
    - internet_service
    - payment_method
  binary:
    - has_tech_support
    - is_senior

# Выбор модели и гиперпараметры каждой. Модель меняется только здесь:
# train.model выбирает, какую из секций ниже передать в build_model.
# random_state не задаём: в модель передаётся общий seed.
train:
  model: logreg            # logreg | random_forest | gradient_boosting
  logreg:
    C: 1.0
    max_iter: 1000
  random_forest:           # значения из baseline_notebook.py
    n_estimators: 157
    max_depth: 9
    min_samples_leaf: 3
  gradient_boosting:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3

evaluate:
  threshold: 0.5
  min_roc_auc: 0.75

validate:
  min_rows: 5000
  max_missing_share: 0.05
  target_rate: [0.05, 0.60]
